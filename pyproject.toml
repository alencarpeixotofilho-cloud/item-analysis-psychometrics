[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "item-analysis-psychometrics"
version = "0.1.0"
description = "CTT and IRT item analysis for multiple-choice exams, with an HTML report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
itemanalysis = "itemanalysis.cli:main"

[tool.setuptools]
packages = ["itemanalysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
